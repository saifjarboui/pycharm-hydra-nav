name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']

# A newer push cancels the run it supersedes (never a release tag).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # GitHub Release on tags
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      # Tag vX.Y.Z must match gradle.properties and have a CHANGELOG.md line, else stop before publishing.
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=${GITHUB_REF_NAME#v}
          grep -qx "pluginVersion=$v" gradle.properties || { echo "gradle.properties pluginVersion is not $v"; exit 1; }
          grep -q "^\*\*$v\*\*" CHANGELOG.md || { echo "CHANGELOG.md has no **$v** line"; exit 1; }
      - name: Test and build
        run: ./gradlew test buildPlugin
      # Downloads several IDEs, so only on release tags; the tag run stops before publishing if it fails.
      - name: Verify plugin (Plugin Verifier)
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew verifyPlugin
      - uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: build/distributions/*.zip
          retention-days: 3
      # Tag vX.Y.Z → upload that version to JetBrains Marketplace, then attach the zip to a GitHub Release.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin -PpluginVersion=${GITHUB_REF_NAME#v}
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/distributions/*.zip --title "$GITHUB_REF_NAME" --generate-notes
